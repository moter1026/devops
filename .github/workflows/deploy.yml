name: Deploy with Docker Compose from GHCR

on:
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Build and push Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/devops_app_lab1:latest .
        docker push ghcr.io/${{ github.repository_owner }}/devops_app_lab1:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    
    steps:
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2431
        script: |
          set -e
          
          IMAGE=ghcr.io/${{ github.repository_owner }}/devops_app_lab1:latest

          echo "=== Starting deployment ==="

          # Логинимся в GHCR
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

          # Обновляем docker-compose файл если нужно
          cd /home/ubuntu/app
          git fetch origin
          git reset --hard origin/docker-compose
          echo "✓ Code updated"

          # Удаляем старые контейнеры
          echo "Stopping old containers..."
          docker compose down || true

          # Удаляем старый образ, чтобы точно обновился
          docker image rm $IMAGE || true

          echo "Pulling updated image..."
          docker pull $IMAGE || exit 1

          echo "Starting new containers with Docker Compose..."
          docker compose up -d

          echo "Waiting for app to start..."
          sleep 10

          echo "=== Checking status ==="
          docker compose ps

          echo "=== App logs ==="
          docker compose logs app --tail=20

          echo "=== Health check ==="
          if curl -f http://localhost:8181/health; then
            echo "Health check passed"
          else
            echo "Health check failed"
            docker compose logs app
            exit 1
          fi

          echo "Deployment completed successfully"