name: Deploy from GHCR

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2431
        script: |
          set -e
          cd /home/ubuntu/app
          
          # Логин в GHCR
          echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          
          # Остановка и запуск через Docker Compose
          docker compose down
          docker compose pull  # Скачиваем обновленные образы
          docker compose up -d
          
          # Проверка
          sleep 10
          docker compose ps
          curl -f http://localhost:8181/health && echo "✅ Deployed successfully"