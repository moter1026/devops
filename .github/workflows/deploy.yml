name: Deploy with Docker Compose

on:
  release:
    types: [ published ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to VM
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: course.prafdin.ru
        username: ubuntu
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 2431
        script: |
          set -e  # Останавливаться при ошибках
          
          cd /home/ubuntu/app
          echo "=== Starting deployment ==="
          
          # Получаем последний код
          git fetch origin
          git reset --hard origin/docker-compose
          echo "✓ Code updated"
          
          # Останавливаем старые контейнеры
          docker compose down
          echo "✓ Old containers stopped"
          
          # Собираем и запускаем новые
          docker compose up -d --build
          echo "✓ New containers started"
          
          # Ждем запуска
          echo "Waiting for app to start..."
          sleep 15
          
          # Проверяем статус
          echo "=== Checking status ==="
          docker compose ps
          
          # Проверяем логи
          echo "=== App logs ==="
          docker compose logs app --tail=20
          
          # Проверяем здоровье
          echo "=== Health check ==="
          curl -f http://localhost:8181/health && echo "✓ Health check passed" || echo "✗ Health check failed"
          
          echo "✅ Deployment completed successfully"